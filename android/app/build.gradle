apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def arsenPackageSuffix = (project.findProperty('arsenPackageSuffix') ?: 'v4').toString()
def arsenVersionCode = (project.findProperty('arsenVersionCode') ?: (arsenPackageSuffix.replaceAll('[^0-9]', '') ?: '4')).toInteger()
def webBuildIndex = file("$rootDir/../dist/index.html")
def packagedWebIndex = file("$projectDir/src/main/assets/public/index.html")
def clerkKey = System.getenv('CLERK_PUBLISHABLE_KEY')
if (clerkKey == null) {
    def localEnv = file("$rootDir/../.env.local")
    def entries = localEnv.exists() ? localEnv.readLines('UTF-8').findAll { it.startsWith('CLERK_PUBLISHABLE_KEY=') } : []
    if (entries.size() > 1) throw new GradleException('CLERK_PUBLISHABLE_KEY está duplicada')
    clerkKey = entries ? entries[0].substring('CLERK_PUBLISHABLE_KEY='.length()).trim() : ''
}
if (clerkKey && (clerkKey.length() > 512 || !(clerkKey ==~ /pk_(test|live)_[A-Za-z0-9_=-]+/))) {
    throw new GradleException('CLERK_PUBLISHABLE_KEY no tiene el formato de una clave pública')
}
def backupOrigin = System.getenv('ARSEN_BACKUP_API_ORIGIN')
if (backupOrigin == null) {
    def localEnv = file("$rootDir/../.env.local")
    def entries = localEnv.exists() ? localEnv.readLines('UTF-8').findAll { it.startsWith('ARSEN_BACKUP_API_ORIGIN=') } : []
    if (entries.size() > 1) throw new GradleException('ARSEN_BACKUP_API_ORIGIN está duplicado')
    backupOrigin = entries ? entries[0].substring('ARSEN_BACKUP_API_ORIGIN='.length()).trim() : ''
}
if (backupOrigin && !(backupOrigin ==~ /https:\/\/[A-Za-z0-9.-]+(?::[0-9]{1,5})?\/?/)) {
    throw new GradleException('ARSEN_BACKUP_API_ORIGIN debe ser un origen HTTPS')
}
def privateBlobOrigin = System.getenv('ARSEN_PRIVATE_BLOB_ORIGIN')
if (privateBlobOrigin == null) {
    def localEnv = file("$rootDir/../.env.local")
    def entries = localEnv.exists() ? localEnv.readLines('UTF-8').findAll { it.startsWith('ARSEN_PRIVATE_BLOB_ORIGIN=') } : []
    if (entries.size() > 1) throw new GradleException('ARSEN_PRIVATE_BLOB_ORIGIN está duplicado')
    privateBlobOrigin = entries ? entries[0].substring('ARSEN_PRIVATE_BLOB_ORIGIN='.length()).trim() : ''
}
if (privateBlobOrigin && !(privateBlobOrigin ==~ /https:\/\/[a-z0-9-]+\.private\.blob\.vercel-storage\.com/)) {
    throw new GradleException('ARSEN_PRIVATE_BLOB_ORIGIN debe ser el origen HTTPS del almacén privado')
}

tasks.register('verifyCapacitorWebAssets') {
    doLast {
        if (!webBuildIndex.exists()) {
            throw new GradleException('Falta dist/index.html. Ejecuta pnpm build antes de generar el APK.')
        }
        if (!packagedWebIndex.exists() || webBuildIndex.getText('UTF-8') != packagedWebIndex.getText('UTF-8')) {
            throw new GradleException('Los assets web del APK están desactualizados. Ejecuta pnpm cap:sync o pnpm cap:build antes de usar Gradle.')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn('verifyCapacitorWebAssets')
}

android {
    buildFeatures { buildConfig true }
    namespace = "com.kumchovy.arsen.codex"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        buildConfigField 'String', 'CLERK_PUBLISHABLE_KEY', '"' + clerkKey + '"'
        buildConfigField 'String', 'ARSEN_BACKUP_API_ORIGIN', '"' + backupOrigin + '"'
        buildConfigField 'String', 'ARSEN_PRIVATE_BLOB_ORIGIN', '"' + privateBlobOrigin + '"'
        applicationId "com.kumchovy.arsen.codex"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode arsenVersionCode
        versionName "1.0.0-${arsenPackageSuffix}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Arsen-${arsenPackageSuffix}-${variant.name}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.13.0'
    implementation 'com.clerk:clerk-android-api:1.5.0'
    implementation 'androidx.work:work-runtime-ktx:2.12.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
